name: Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      UID_NUM: '911'
      GID_NUM: '911'
    steps:
      - name: Restore saved state
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: state
          key: webtop-state-${{ github.run_id }}-x
          restore-keys: |
            webtop-state-

      - name: Start Docker
        run: |
          mkdir -p config
          {
            echo "=== THIS RUN: ${{ github.run_id }} ==="
            if [ -f state/config.tar.gz ]; then
              tar xzf state/config.tar.gz -C config --no-same-owner
              rm -rf config/.dbus config/.pulse config/.config/pulse config/.cache config/.XDG config/.ICEauthority
              find config -name '*.lock' -delete 2>/dev/null || true
              sudo chown -R "$UID_NUM:$GID_NUM" config
              sudo chmod -R u+rwX config
              echo "STATE: RESTORED ($(find config -type f | wc -l) files)"
              echo "MARKER-FROM-PREV-RUN: $(cat config/.session-marker 2>/dev/null || echo NONE)"
              echo "DESKTOP-FROM-PREV-RUN: $(tr '\n' ' ' < state/desktop.txt 2>/dev/null || echo NONE)"
            else
              echo "STATE: FRESH (no cache)"
              echo "MARKER-FROM-PREV-RUN: NONE"
              echo "DESKTOP-FROM-PREV-RUN: NONE"
            fi
          } | tee /tmp/status.txt
          docker run -d \
            --name webtop \
            --network host \
            --security-opt seccomp=unconfined \
            --shm-size=1gb \
            --restart unless-stopped \
            -v "$PWD/config:/config" \
            -e CUSTOM_USER=admin \
            -e PUID=$UID_NUM \
            -e PGID=$GID_NUM \
            -e PASSWORD="${{ secrets.WEBTOP_PASSWORD || 'Lx0fc698f9-17z' }}" \
            ghcr.io/linuxserver/webtop
          sleep 80
          docker exec webtop sh -c 'pgrep -x xfce4-session >/dev/null && echo "XFCE-SESSION: RUNNING" || echo "XFCE-SESSION: DEAD"' | tee -a /tmp/status.txt || true

      - name: Reinstall saved packages
        run: |
          if [ ! -f state/packages.txt ]; then
            echo "no package list"
            exit 0
          fi
          NAMES=$(sed 's/-[^\-]*$//' state/packages.txt | grep -v '^$' | tr '\n' ' ')
          docker cp state/packages.txt webtop:/tmp/pkgs.txt
          docker exec webtop sh -c "apk add --no-cache $NAMES 2>&1 | tail -3 || true"

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb >/dev/null 2>&1

      - name: Expose desktop and print URL
        run: |
          nohup cloudflared tunnel --url http://localhost:3000 > /tmp/tunnel.log 2>&1 &
          echo $! > /tmp/tunnel.pid
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          [ -z "$URL" ] && { echo "::error::no tunnel URL"; exit 1; }
          echo "$URL" > /tmp/url.txt
          tail -n +2 /tmp/status.txt >> /tmp/url.txt
          { cat /tmp/status.txt; echo "$URL"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-url
          path: /tmp/url.txt
          retention-days: 1

      - name: Snapshot a
        if: always()
        run: |
          sleep 1500
          mkdir -p state
          docker exec webtop sh -c "echo 'MARKER: run-${{ github.run_id }} ckpt-a $(date -u +%Y%m%dT%H%M%SZ)' > /config/.session-marker" || true
          docker exec webtop tar czf /tmp/cfg.tar.gz -C /config .
          docker cp webtop:/tmp/cfg.tar.gz state/config.tar.gz || true
          docker exec webtop sh -c 'apk info > /tmp/pkgs.txt 2>/dev/null || true'
          docker cp webtop:/tmp/pkgs.txt state/packages.txt || true
          docker exec webtop sh -c 'ls -A /config/Desktop > /tmp/desktop.txt 2>/dev/null || true'
          docker cp webtop:/tmp/desktop.txt state/desktop.txt || true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: webtop-state-${{ github.run_id }}-a

      - name: Snapshot b
        if: always()
        run: sleep 1500
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: webtop-state-${{ github.run_id }}-b

      - name: Snapshot c
