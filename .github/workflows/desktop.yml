name: Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      STATE_IMAGE: ${{ secrets.DOCKER_USER }}/webtop-state:latest
      BASE_IMAGE: ghcr.io/linuxserver/webtop:latest
    steps:
      - name: Resolve image (restore saved state if present)
        id: img
        run: |
          if docker pull "$STATE_IMAGE" 2>/dev/null; then
            echo "restored=true" >> "$GITHUB_OUTPUT"
            echo "image=$STATE_IMAGE" >> "$GITHUB_OUTPUT"
            echo "### Restored previous session" >> "$GITHUB_STEP_SUMMARY"
          else
            docker pull "$BASE_IMAGE"
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "image=$BASE_IMAGE" >> "$GITHUB_OUTPUT"
            echo "### Fresh start (no saved state yet)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Start Docker
        run: |
          docker run -d \
            --name webtop \
            --network host \
            --security-opt seccomp=unconfined \
            --shm-size=1gb \
            --restart unless-stopped \
            -e CUSTOM_USER=admin \
            -e PASSWORD="${{ secrets.WEBTOP_PASSWORD || 'Lx0fc698f9-17z' }}" \
            "${{ steps.img.outputs.image }}"

      - name: Periodic state snapshot
        run: |
          if [ -z "${{ secrets.DOCKER_TOKEN }}" ]; then
            echo "::warning::DOCKER_TOKEN not configured - session will NOT be saved"
            exit 0
          fi
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin
          cat > /tmp/snap.sh <<'EOS'
          #!/bin/bash
          while true; do
            sleep 1800
            ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            if docker commit webtop "$STATE_IMAGE" >/dev/null 2>&1 \
               && docker push "$STATE_IMAGE" >/dev/null 2>&1; then
              echo "$ts snapshot saved"
              docker image prune -f >/dev/null 2>&1
            else
              echo "$ts snapshot FAILED"
            fi
          done
          EOS
          chmod +x /tmp/snap.sh
          STATE_IMAGE="$STATE_IMAGE" nohup /tmp/snap.sh > /tmp/snap.log 2>&1 &
          echo "snapshot loop started (every 30 minutes)"

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb >/dev/null 2>&1

      - name: Expose desktop and print URL
        run: |
          nohup cloudflared tunnel --url http://localhost:3000 > /tmp/tunnel.log 2>&1 &
          echo $! > /tmp/tunnel.pid
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "::error::cloudflared tunnel did not produce a URL"
            exit 1
          fi
          echo "TUNNEL_URL=$URL" >> "$GITHUB_ENV"
          echo "$URL" > /tmp/url.txt
          echo "### Linux desktop is live" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "State restored: ${{ steps.img.outputs.restored }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-url
          path: /tmp/url.txt
          retention-days: 1

      - name: Keep tunnel alive
        run: |
          while kill -0 "$(cat /tmp/tunnel.pid)" 2>/dev/null; do sleep 30; done
          echo "::error::cloudflared tunnel process exited unexpectedly"
          exit 1