name: Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Restore saved state
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: state
          key: webtop-state-${{ github.run_id }}-x
          restore-keys: |
            webtop-state-

      - name: Start Docker
        run: |
          mkdir -p config
          if [ -f state/config.tar.gz ]; then
            tar xzf state/config.tar.gz -C config
            echo "RESTORED-from-$(ls -1 state | tr '\n' ' ')" > /tmp/status.txt
            echo "### State restored from previous run" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "FRESH-no-cache-found" > /tmp/status.txt
            echo "### No saved state yet - starting fresh" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f state/packages.txt ]; then
            docker run -d --name boot -v "$PWD/config:/config" \
              -e CUSTOM_USER=admin ghcr.io/linuxserver/webtop >/dev/null
            sleep 20
            docker cp state/packages.txt boot:/tmp/pkgs.txt
            docker exec boot sh -c 'sed "s/-[^-]*$//" /tmp/pkgs.txt | grep -v "^$" | xargs apk add --no-cache >/dev/null 2>&1 || true'
            docker commit boot webtop-restored >/dev/null
            docker rm -f boot >/dev/null
            docker run -d --name webtop --network host \
              --security-opt seccomp=unconfined --shm-size=1gb --restart unless-stopped \
              -v "$PWD/config:/config" \
              -e CUSTOM_USER=admin \
              -e PASSWORD="${{ secrets.WEBTOP_PASSWORD || 'Lx0fc698f9-17z' }}" \
              webtop-restored
          else
            docker run -d --name webtop --network host \
              --security-opt seccomp=unconfined --shm-size=1gb --restart unless-stopped \
              -v "$PWD/config:/config" \
              -e CUSTOM_USER=admin \
              -e PASSWORD="${{ secrets.WEBTOP_PASSWORD || 'Lx0fc698f9-17z' }}" \
              ghcr.io/linuxserver/webtop
          fi

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb >/dev/null 2>&1

      - name: Expose desktop and print URL
        run: |
          nohup cloudflared tunnel --url http://localhost:3000 > /tmp/tunnel.log 2>&1 &
          echo $! > /tmp/tunnel.pid
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          [ -z "$URL" ] && { echo "::error::no tunnel URL"; exit 1; }
          echo "$URL" > /tmp/url.txt
          cat /tmp/status.txt >> /tmp/url.txt
          echo "### Linux desktop is live" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-url
          path: /tmp/url.txt
          retention-days: 1

      - name: Snapshot A
        if: always()
        run: |
          sleep 900
          mkdir -p state
          docker exec webtop tar czf /tmp/cfg.tar.gz -C /config .
          docker cp webtop:/tmp/cfg.tar.gz state/config.tar.gz || true
          docker exec webtop sh -c 'apk info > /tmp/pkgs.txt 2>/dev/null || true'
          docker cp webtop:/tmp/pkgs.txt state/packages.txt || true
          du -h state/config.tar.gz 2>/dev/null || true

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: webtop-state-${{ github.run_id }}-a

      - name: Snapshot B
        if: always()
        run: sleep 6600
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: webtop-state-${{ github.run_id }}-b

      - name: Snapshot C
        if: always()
        run: |
          docker exec webtop tar czf /tmp/cfg.tar.gz -C /config .
          docker cp webtop:/tmp/cfg.tar.gz state/config.tar.gz || true
          docker exec webtop sh -c 'apk info > /tmp/pkgs.txt 2>/dev/null || true'
          docker cp webtop:/tmp/pkgs.txt state/packages.txt || true
      - name: wait
        if: always()
        run: sleep 7200
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: webtop-state-${{ github.run_id }}-c

      - name: Final snapshot
        if: always()
        run: |
          docker exec webtop tar czf /tmp/cfg.tar.gz -C /config .
          docker cp webtop:/tmp/cfg.tar.gz state/config.tar.gz || true
          docker exec webtop sh -c 'apk info > /tmp/pkgs.txt 2>/dev/null || true'
          docker cp webtop:/tmp/pkgs.txt state/packages.txt || true
      - name: wait
        if: always()
        run: sleep 4800
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: webtop-state-${{ github.run_id }}-d