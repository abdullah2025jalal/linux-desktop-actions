name: Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Start Docker
        run: |
          docker run -d \
            --network host \
            --security-opt seccomp=unconfined \
            --shm-size=1gb \
            --restart unless-stopped \
            -e CUSTOM_USER=admin \
            -e PASSWORD=Lx0fc698f9-17z \
            ghcr.io/linuxserver/webtop

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb >/dev/null 2>&1

      - name: Expose desktop and print URL
        run: |
          cloudflared tunnel --url http://localhost:3000 2>&1 | tee /tmp/tunnel.log

      - name: URL
        if: always()
        run: grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log || true
