name: Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Start Docker
        run: |
          docker run -d \
            --network host \
            --security-opt seccomp=unconfined \
            --shm-size=1gb \
            --restart unless-stopped \
            -e CUSTOM_USER=admin \
            -e PASSWORD=Lx0fc698f9-17z \
            ghcr.io/linuxserver/webtop

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb >/dev/null 2>&1

      - name: Expose desktop and print URL
        run: |
          nohup cloudflared tunnel --url http://localhost:3000 > /tmp/tunnel.log 2>&1 &
          echo $! > /tmp/tunnel.pid
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "::error::cloudflared tunnel did not produce a URL"
            exit 1
          fi
          echo "TUNNEL_URL=$URL" >> "$GITHUB_ENV"
          echo "$URL" > /tmp/url.txt
          echo "### Linux desktop is live" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-url
          path: /tmp/url.txt
          retention-days: 1

      - name: Keep tunnel alive
        run: |
          while kill -0 "$(cat /tmp/tunnel.pid)" 2>/dev/null; do sleep 30; done
          echo "::error::cloudflared tunnel process exited unexpectedly"
          exit 1