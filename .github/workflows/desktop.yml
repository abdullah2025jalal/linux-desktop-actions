name: Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      UID_NUM: '911'
      GID_NUM: '911'
    steps:
      - name: Restore saved state
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: state
          key: webtop-state-${{ github.run_id }}-x
          restore-keys: |
            webtop-state-

      - name: Start Docker
        run: |
          mkdir -p config
          if [ -f state/config.tar.gz ]; then
            tar xzf state/config.tar.gz -C config --no-same-owner
            rm -rf config/.dbus config/.pulse config/.config/pulse config/.cache config/.XDG config/.ICEauthority
            find config -name '*.lock' -delete 2>/dev/null || true
            sudo chown -R "$UID_NUM:$GID_NUM" config
            sudo chmod -R u+rwX config
            FILES=$(find config -type f | wc -l)
            echo "RESTORED ($FILES files, ownership fixed)" > /tmp/status.txt
            echo "### Restored $FILES files from previous run" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "FRESH (no cache)" > /tmp/status.txt
            echo "### No saved state yet - starting fresh" >> "$GITHUB_STEP_SUMMARY"
          fi
          docker run -d \
            --name webtop \
            --network host \
            --security-opt seccomp=unconfined \
            --shm-size=1gb \
            --restart unless-stopped \
            -v "$PWD/config:/config" \
            -e CUSTOM_USER=admin \
            -e PUID=$UID_NUM \
            -e PGID=$GID_NUM \
            -e PASSWORD="${{ secrets.WEBTOP_PASSWORD || 'Lx0fc698f9-17z' }}" \
            ghcr.io/linuxserver/webtop
          sleep 75
          docker exec webtop sh -c 'pgrep -x xfce4-session >/dev/null && echo "DESKTOP OK" || echo "DESKTOP MISSING"' || true

      - name: Reinstall saved packages
        run: |
          if [ ! -f state/packages.txt ]; then
            echo "no package list - nothing to replay"
            exit 0
          fi
          NAMES=$(sed 's/-[^\-]*$//' state/packages.txt | grep -v '^$' | tr '\n' ' ')
          docker cp state/packages.txt webtop:/tmp/pkgs.txt
          docker exec webtop sh -c "apk add --no-cache $NAMES 2>&1 | tail -3 || true"

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb >/dev/null 2>&1

      - name: Expose desktop and print URL
        run: |
          nohup cloudflared tunnel --url http://localhost:3000 > /tmp/tunnel.log 2>&1 &
          echo $! > /tmp/tunnel.pid
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          [ -z "$URL" ] && { echo "::error::no tunnel URL"; exit 1; }
          echo "$URL" > /tmp/url.txt
          cat /tmp/status.txt >> /tmp/url.txt
          echo "### Linux desktop is live" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-url
          path: /tmp/url.txt
          retention-days: 1

      - name: Snapshot A
        if: always()
        run: |
          sleep 900
          mkdir -p state
          docker exec webtop tar czf /tmp/cfg.tar.gz -C /config .
          docker cp webtop:/tmp/cfg.tar.gz state/config.tar.gz || true
          docker exec webtop sh -c 'apk info > /tmp/pkgs.txt 2>/dev/null || true'
          docker cp webtop:/tmp/pkgs.txt state/packages.txt || true

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: webtop-state-${{ github.run_id }}-a

      - name: Snapshot B
        if: always()
        run: sleep 6600
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: webtop-state-${{ github.run_id }}-b

      - name: Snapshot C
        if: always()
        run: |
          docker exec webtop tar czf /tmp/cfg.tar.gz -C /config .
          docker cp webtop:/tmp/cfg.tar.gz state/config.tar.gz || true
          docker exec webtop sh -c 'apk info > /tmp/pkgs.txt 2>/dev/null || true'
          docker cp webtop:/tmp/pkgs.txt state/packages.txt || true
      - name: wait
        if: always()
        run: sleep 7200
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: webtop-state-${{ github.run_id }}-c

      - name: Final snapshot
        if: always()
        run: |
          docker exec webtop tar czf /tmp/cfg.tar.gz -C /config .
          docker cp webtop:/tmp/cfg.tar.gz state/config.tar.gz || true
          docker exec webtop sh -c 'apk info > /tmp/pkgs.txt 2>/dev/null || true'
          docker cp webtop:/tmp/pkgs.txt state/packages.txt || true
      - name: wait
        if: always()
        run: sleep 4800
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: webtop-state-${{ github.run_id }}-d