name: Diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Restore
        uses: actions/cache/restore@v4
        with:
          path: state
          key: diag2-${{ github.run_id }}
          restore-keys: |
            webtop-state-
      - name: Inspect tarball
        run: |
          ls -la state/
          echo "=== SIZE ==="
          du -b state/config.tar.gz
          echo "=== FILE TYPE ==="
          file state/config.tar.gz
          echo "=== GZIP INTEGRITY ==="
          gzip -t state/config.tar.gz && echo "gzip OK" || echo "gzip CORRUPT"
          echo "=== ENTRY COUNT ==="
          tar tzf state/config.tar.gz > /tmp/list.txt 2>/tmp/err.txt; echo "tar_exit=$?"
          wc -l /tmp/list.txt
          echo "=== FIRST 25 ENTRIES ==="
          head -25 /tmp/list.txt
          echo "=== STDERR ==="
          head -10 /tmp/err.txt
          echo "=== EXTRACT AND LOOK ==="
          rm -rf out; mkdir -p out
          tar xzf state/config.tar.gz -C out
          echo "extracted:"; find out -maxdepth 3 | head -30
          echo "total files:"; find out -type f | wc -l