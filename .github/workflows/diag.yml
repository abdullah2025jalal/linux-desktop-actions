name: Diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Restore
        uses: actions/cache/restore@v4
        with:
          path: state
          key: diag3-${{ github.run_id }}
          restore-keys: |
            webtop-state-
      - name: Compare fresh vs restored
        run: |
          check() {
            echo "----- $1 -----"
            docker exec $2 ps -eo comm 2>/dev/null | grep -Ei 'Xvfb|Xvnc|x11vnc|xfce|selkies|fluxbox|openbox|pixelflux|audio' | sort | tr '\n' ' '; echo
            echo "port3000: $(docker exec $2 sh -c 'wget -qO- --timeout=5 http://localhost:3000/ >/dev/null 2>&1 && echo SERVES || echo DEAD')"
            echo "--- last logs ---"
            docker logs --tail 12 $2 2>&1 | sed 's/^/   /'
          }

          echo "############ TEST A: FRESH (no restored config) ############"
          docker run -d --name fresh --network host --security-opt seccomp=unconfined --shm-size=1gb -e CUSTOM_USER=admin -e PASSWORD=x ghcr.io/linuxserver/webtop >/dev/null
          sleep 60
          check FRESH fresh
          docker rm -f fresh >/dev/null

          echo ""
          echo "############ TEST B: WITH RESTORED CONFIG ############"
          mkdir -p config
          tar xzf state/config.tar.gz -C config --no-same-owner
          rm -rf config/.dbus config/.pulse config/.config/pulse config/.cache
          find config -name '*.lock' -delete 2>/dev/null || true
          echo "config tree (top):"; ls -la config | sed 's/^/   /'
          echo "dconf/user present: $(test -f config/.config/dconf/user && echo YES || echo NO)"
          docker run -d --name rest --network host --security-opt seccomp=unconfined --shm-size=1gb -v "$PWD/config:/config" -e CUSTOM_USER=admin -e PASSWORD=x ghcr.io/linuxserver/webtop >/dev/null
          sleep 60
          check RESTORED rest
          echo "--- ownership inside /config ---"
          docker exec rest sh -c 'ls -lan /config | head -12' | sed 's/^/   /'