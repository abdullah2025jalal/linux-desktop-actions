name: Diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore
        uses: actions/cache/restore@v4
        with:
          path: state
          key: diag4-${{ github.run_id }}
          restore-keys: |
            webtop-state-
      - name: Test ownership fix
        run: |
          mkdir -p config
          tar xzf state/config.tar.gz -C config --no-same-owner
          rm -rf config/.dbus config/.pulse config/.config/pulse config/.cache config/.XDG config/.ICEauthority
          find config -name '*.lock' -delete 2>/dev/null || true
          echo "BEFORE chown:"; ls -lan config | head -8 | sed 's/^/   /'
          sudo chown -R 911:911 config
          sudo chmod -R u+rwX config
          echo "AFTER chown:"; ls -lan config | head -8 | sed 's/^/   /'
          docker run -d --name fix --network host --security-opt seccomp=unconfined --shm-size=1gb \
            -v "$PWD/config:/config" -e CUSTOM_USER=admin -e PASSWORD=x -e PUID=911 -e PGID=911 \
            ghcr.io/linuxserver/webtop >/dev/null
          sleep 75
          echo "=== desktop processes ==="
          docker exec fix ps -eo comm | grep -Ei 'Xvfb|selkies|xfce|openbox' | sort | tr '\n' ' '; echo
          echo "=== xfce4-session running? ==="
          docker exec fix sh -c 'pgrep -x xfce4-session >/dev/null && echo "YES - DESKTOP UP" || echo "NO - STILL BROKEN"'
          echo "=== logs ==="
          docker logs --tail 6 fix 2>&1 | sed 's/^/   /'