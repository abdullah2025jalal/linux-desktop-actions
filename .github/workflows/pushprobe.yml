name: PushProbe

# one-off: proves the NTFY_TOPIC secret resolves inside workflows and that
# GitHub runners can POST to ntfy.sh. Prints only lengths and codes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          echo "PRESENT=$([ -n "$NTFY_TOPIC" ] && echo yes || echo no)"
          echo "LEN=${#NTFY_TOPIC}"
          CODE=$(curl -s -o /tmp/probe_body -w '%{http_code}' -X POST "https://ntfy.sh/$NTFY_TOPIC" \
            -H "Title: ActionProbe" -H "Priority: low" --data-binary "probe from gh runner $(date -u +'%H:%M:%S')")
          echo "CODE=$CODE"
          head -c 240 /tmp/probe_body; echo
