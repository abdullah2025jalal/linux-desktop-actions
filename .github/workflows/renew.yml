name: Renew

# The renewer is the guarantee that the chain never breaks.
#
# It is armed at the START of a Desktop session (not at the end - the end
# never runs because the Desktop job is killed by its own timeout first).
# It watches one specific Desktop run by id. When that run finishes:
#
#   conclusion == success -> the Desktop already dispatched the next session
#                            itself, so the renewer does nothing.
#   anything else        -> the Desktop was killed before it could hand over,
#                            so the renewer dispatches the replacement.
#
# Result: the gap between one session dying and the next one starting is
# ~30 seconds instead of the 25..52 minutes the cron watchdog used to leave.

on:
  workflow_dispatch:
    inputs:
      watch_run:
        description: 'Run id of the Desktop session to watch'
        required: false
        default: '0'
      keep_alive:
        description: 'Chain the next session (false stops after the next one)'
        required: false
        default: 'true'

permissions:
  actions: write
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    # Must outlive the Desktop job (350 min) so it can catch its death.
    timeout-minutes: 358
    steps:
      - name: Wait for the watched Desktop session to finish
        id: watch
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const watch = '${{ inputs.watch_run }}';
            const sleep = ms => new Promise(r => setTimeout(r, ms));

            let conclusion = 'watch-timeout';
            let runNumber = '?';

            if (watch && watch !== '0') {
              for (let i = 0; i < 1150; i++) {      // 1150 * 30 s = ~9.5 h
                const { data } = await github.rest.actions.getWorkflowRun({
                  owner, repo, run_id: Number(watch)
                });
                runNumber = data.run_number;
                if (data.status === 'completed') {
                  conclusion = data.conclusion || 'unknown';
                  core.info('Watched run #' + runNumber + ' finished: ' + conclusion);
                  break;
                }
                if (i % 20 === 0) {
                  core.info('still waiting on run #' + runNumber + ' (' + data.status + ')');
                }
                await sleep(30000);
              }
            } else {
              core.warning('No run id given; falling back to "is anything live?".');
            }

            await sleep(20000);   // let the runner release fully
            core.setOutput('conclusion', conclusion);
            core.setOutput('run_number', runNumber);

      - name: Chain the next session
        uses: actions/github-script@v7
        env:
          CONCLUSION: ${{ steps.watch.outputs.conclusion }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const conclusion = process.env.CONCLUSION || 'unknown';

            if (conclusion === 'success') {
              core.info('Desktop finished cleanly and already chained the next session. Nothing to do.');
              return;
            }

            core.info('Desktop did NOT finish cleanly (' + conclusion + '). Chaining the next session.');

            for (let attempt = 1; attempt <= 5; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, per_page: 20, workflow_id: 'desktop.yml'
              });
              const live = data.workflow_runs.filter(
                r => r.status === 'in_progress' || r.status === 'queued');
              if (live.length > 0) {
                core.info('A Desktop session is already live (' +
                  live.map(r => r.run_number).join(', ') + '). Not dispatching another.');
                return;
              }
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo,
                  workflow_id: 'desktop.yml',
                  ref: context.ref,
                  inputs: { 'keep-alive': '${{ inputs.keep_alive }}' }
                });
                core.info('Next Desktop session dispatched (attempt ' + attempt + ').');
                return;
              } catch (e) {
                core.warning('dispatch attempt ' + attempt + ' failed: ' + e.message);
                await new Promise(r => setTimeout(r, 15000));
              }
            }
            core.setFailed('Could not dispatch the next Desktop session.');

      - name: Confirm the new session published its URL and emailed
        if: always()
        run: |
          echo "Waiting for the new session to publish its URL and send the email..."
          for i in $(seq 1 40); do
            sleep 30
            LIST=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=10" \
                   --jq '.workflow_runs[] | select(.name=="Desktop" and .status=="in_progress") | .id' 2>/dev/null | head -1)
            [ -z "$LIST" ] && continue
            URLFILE=$(gh api "repos/${{ github.repository }}/actions/runs/$LIST/artifacts" \
                      --jq '.artifacts[] | select(.name=="tunnel-url") | .archive_download_url' 2>/dev/null | head -1)
            [ -z "$URLFILE" ] && continue
            if gh api "$URLFILE" > /tmp/es.zip 2>/dev/null && unzip -o -q /tmp/es.zip -d /tmp/es 2>/dev/null; then
              if grep -q 'RESULT=SENT' /tmp/es/email-status.txt 2>/dev/null; then
                echo ">>> CHAIN HEALTHY: the new session is live and the email was sent"
                exit 0
              fi
            fi
          done
          echo "::warning::could not confirm the new session within 20 minutes"

      - name: Chain summary
        if: always()
        run: |
          {
            echo "### Renewer finished"
            echo ""
            echo "- watched run: ${{ steps.watch.outputs.run_number }}"
            echo "- its conclusion: ${{ steps.watch.outputs.conclusion }}"
            echo "- keep_alive: ${{ inputs.keep_alive }}"
          } >> "$GITHUB_STEP_SUMMARY"
